<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elenco Tuscania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ====== CONFIGURAZIONE ====== */
  :root{
    --bg:#0e0d12;
    --card:#1a1820;
    --card-hover:#211e28;
    --line:#2a2731;
    --text:#f4f2f7;
    --muted:#8d8896;
    --accent:#c9a24b;
    --green:#25d366;
    --green-soft:rgba(37,211,102,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Montserrat',system-ui,sans-serif;
    background:radial-gradient(ellipse at top,#1d1622 0%,var(--bg) 60%);
    background-color:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;justify-content:center;
    padding:48px 16px 64px;
  }
  .wrap{width:100%;max-width:520px}
  header{text-align:center;margin-bottom:32px}
  h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .counter{
    margin-top:14px;display:inline-flex;gap:8px;align-items:center;
    font-size:.85rem;color:var(--muted);
    background:var(--card);border:1px solid var(--line);
    padding:8px 16px;border-radius:999px;
  }
  .counter b{color:var(--green)}
  .bar{height:4px;background:var(--line);border-radius:4px;margin-top:18px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s ease}

  .deadline{
    margin-bottom:16px;padding:16px 20px;border-radius:18px;text-align:center;
    background:var(--card);border:1px solid var(--line);
  }
  .deadline b{display:block;font-size:1.1rem;color:var(--accent)}
  .deadline small{color:var(--muted);font-size:.8rem}
  .deadline.late b{color:#ff6b6b}
  .tabs{display:flex;gap:6px;padding:4px;margin-bottom:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
  .tabs button{
    flex:1;padding:10px 6px;border:0;border-radius:10px;cursor:pointer;
    background:transparent;color:var(--muted);font:600 .85rem 'Montserrat',sans-serif;transition:all .2s;
  }
  .tabs button.on{background:var(--line);color:var(--text)}
  .tabs button[data-f="dapagare"]{color:#ff6b6b}
  .tabs button[data-f="dapagare"].on{background:rgba(255,107,107,.15);color:#ff6b6b}
  .tabs button[data-f="pagati"]{color:var(--green)}
  .tabs button[data-f="pagati"].on{background:var(--green-soft);color:var(--green)}
  li.hide{display:none}
  .empty{display:none;padding:24px;text-align:center;color:var(--muted);font-size:.9rem}
  .empty.show{display:block}
  ul{list-style:none;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
  li + li{border-top:1px solid var(--line)}
  label{
    display:flex;align-items:center;gap:16px;
    padding:18px 20px;cursor:pointer;transition:background .2s;
    -webkit-tap-highlight-color:transparent;
  }
  label:hover{background:var(--card-hover)}
  input{position:absolute;opacity:0;pointer-events:none}
  .box{
    flex:none;width:24px;height:24px;border-radius:7px;
    border:2px solid #4a4652;display:grid;place-items:center;
    transition:all .2s ease;
  }
  .box svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:all .2s ease}
  input:checked + .box{background:var(--green);border-color:var(--green)}
  input:checked + .box svg{opacity:1;transform:scale(1)}
  .name{flex:1;font-weight:600;font-size:1.05rem;transition:color .2s}
  input:checked ~ .name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
  .num{color:var(--muted);font-size:.8rem;font-weight:500;width:20px;flex:none}
  .pill{
    flex:none;font-size:.85rem;font-weight:600;color:#ff6b6b;
    background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.3);
    padding:5px 12px;border-radius:999px;transition:all .2s;
  }
  input:checked ~ .pill{color:var(--green);background:var(--green-soft);border-color:rgba(37,211,102,.25)}

  .sum{
    margin-top:16px;display:flex;justify-content:space-between;align-items:center;
    padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  }
  .sum span{color:var(--muted);font-size:.9rem;font-weight:500}
  .sum b{font-size:1.4rem;color:var(--green)}
  .sum small{color:var(--muted);font-size:.85rem;font-weight:500}
  .share{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    margin-top:12px;padding:14px;border-radius:14px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--text);
    font:600 .95rem 'Montserrat',sans-serif;text-decoration:none;
  }
  .share svg{width:18px;height:18px}
  .actions{display:flex;flex-direction:column;gap:12px;margin-top:32px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    padding:16px;border-radius:14px;text-decoration:none;color:#fff;
    font-weight:700;font-size:1rem;transition:transform .15s,filter .2s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.98)}
  .btn svg{width:22px;height:22px;flex:none}
  .wa{background:var(--green)}
  .ig{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Elenco <span>Tuscania</span></h1>
    <div class="counter">Pagato: <b id="paid">0</b> / <span id="total">0</span></div>
    <div class="bar"><i id="progress"></i></div>
  </header>

  <div class="deadline" id="deadline"><b id="countdown"></b><small>Scadenza: 22 ottobre, ore 24:00</small></div>

  <div class="tabs">
    <button class="on" data-f="tutti">Tutti</button>
    <button data-f="dapagare">Da pagare</button>
    <button data-f="pagati">Pagati</button>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty"></div>

  <div class="sum">
    <span>Totale raccolto</span>
    <div><b id="raccolto">€0,00</b> <small id="atteso"></small></div>
  </div>

  <a class="share" id="share" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
    Invia riepilogo a Mattia
  </a>


  <div class="actions">
    <a class="btn wa" id="wa" href="https://wa.me/393714600364" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.03c-.24.68-1.42 1.3-1.95 1.35-.5.05-.97.23-3.27-.68-2.77-1.09-4.52-3.92-4.66-4.1-.13-.18-1.11-1.48-1.11-2.82 0-1.34.7-2 .95-2.27.25-.27.54-.34.72-.34h.52c.17 0 .39-.06.61.47.24.55.79 1.9.86 2.04.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.07.18-.27.36-.23.61-.14.25.09 1.59.75 1.86.89.27.14.45.2.52.32.07.11.07.66-.17 1.33z"/></svg>
      “Contatta Mattia”
    </a>
    <a class="btn ig" id="ig" href="https://www.instagram.com/_mattia_gipsi" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".6" fill="#fff"/></svg>
      Instagram
    </a>
  </div>

  <footer>Le spunte restano salvate su questo dispositivo.</footer>
</div>

<script>
  // ====== MODIFICA QUI ======
  const QUOTA = 40; // euro a persona
  const NOMI = [
    "Nicolò Salta",
    "Emma Vincenti",
    "Lavinia Andreani",
    "Adelaide Di Fabio",
    "Camilla Napoli",
    "Edo Conticiani",
    "Jacopo Grancani",
    "Alessia Ruiu",
    "Matilde Marchetti",
    "Manuel Matarazzo",
    "Susanna Tudorache",
    "Amanda Bordo",
    "Alice Fieno",
    "Alessia Testa",
    "Flavio Lupidi",
    "Pierpaolo Arieti",
    "Jenny Aquilani",
    "Ambra Goddi",
    "Azzurra Felici",
    "Alessandra Seripa",
    "Chiara Maneschi"
  ];
  const SCADENZA = new Date("2026-10-22T23:59:59+02:00");
  const WHATSAPP = "393714600364";
  // ==========================

  const euro = n => "€" + n.toLocaleString("it-IT", {minimumFractionDigits:2, maximumFractionDigits:2});
  const KEY = "elenco-tuscania";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}

  const list = document.getElementById("list");
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="#0e0d12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  NOMI.forEach((nome, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <label>
        <span class="num">${i + 1}</span>
        <input type="checkbox" ${saved[nome] ? "checked" : ""}>
        <span class="box">${check}</span>
        <span class="name"></span>
        <span class="pill">${euro(QUOTA)}</span>
      </label>`;
    li.querySelector(".name").textContent = nome;
    li.querySelector("input").addEventListener("change", e => {
      saved[nome] = e.target.checked;
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch(e) {}
      update();
    });
    list.appendChild(li);
  });

  // Filtro
  let filtro = "tutti";
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    filtro = b.dataset.f;
    applicaFiltro();
  }));
  function applicaFiltro(){
    let visibili = 0;
    list.querySelectorAll("li").forEach(li => {
      const ok = li.querySelector("input").checked;
      const mostra = filtro === "tutti" || (filtro === "pagati" ? ok : !ok);
      li.classList.toggle("hide", !mostra);
      if (mostra) visibili++;
    });
    list.style.display = visibili ? "" : "none";
    const empty = document.getElementById("empty");
    empty.textContent = filtro === "pagati" ? "Nessuno ha ancora pagato." : "Hanno pagato tutti! 🎉";
    empty.classList.toggle("show", !visibili);
  }

  // Conto alla rovescia
  function countdown(){
    const diff = SCADENZA - new Date();
    const el = document.getElementById("countdown");
    document.getElementById("deadline").classList.toggle("late", diff <= 0);
    if (diff <= 0) { el.textContent = "Scadenza superata"; return; }
    const giorni = Math.floor(diff / 86400000);
    const ore = Math.floor(diff / 3600000);
    if (giorni >= 1) el.textContent = `Mancano ${giorni} ${giorni === 1 ? "giorno" : "giorni"} per pagare`;
    else if (ore >= 1) el.textContent = `Mancano ${ore} ${ore === 1 ? "ora" : "ore"} per pagare`;
    else el.textContent = "Mancano meno di un'ora per pagare";
  }
  countdown();
  setInterval(countdown, 60000);

  // Riepilogo WhatsApp
  function riepilogo(){
    const pagati = NOMI.filter(n => saved[n]);
    const mancano = NOMI.filter(n => !saved[n]);
    const testo =
      `*Elenco Tuscania – Riepilogo*\n\n` +
      `✅ Pagato (${pagati.length}):\n${pagati.map(n => "- " + n).join("\n") || "- nessuno"}\n\n` +
      `❌ Da pagare (${mancano.length}):\n${mancano.map(n => "- " + n).join("\n") || "- nessuno"}\n\n` +
      `💰 Raccolto: ${euro(pagati.length * QUOTA)} / ${euro(NOMI.length * QUOTA)}`;
    document.getElementById("share").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(testo)}`;
  }

  function update(){
    const paid = list.querySelectorAll("input:checked").length;
    document.getElementById("paid").textContent = paid;
    document.getElementById("total").textContent = NOMI.length;
    document.getElementById("raccolto").textContent = euro(paid * QUOTA);
    document.getElementById("atteso").textContent = "/ " + euro(NOMI.length * QUOTA);
    document.getElementById("progress").style.width = (paid / NOMI.length * 100) + "%";
    applicaFiltro();
    riepilogo();
  }
  update();
</script>
</body>
</html>
